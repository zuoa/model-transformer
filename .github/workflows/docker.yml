name: Build and publish Docker image

# Builds the image and pushes it to the GitHub Container Registry (GHCR).
# The rknn-toolkit2 v2.3.2 cp312 wheel is fetched at build time (sparse checkout
# of airockchip/rknn-toolkit2) so the published image has full RKNN support.
#
# Resulting image: ghcr.io/<repo-owner>/<repo-name>
#   e.g. https://github.com/zuoa/model-transformer -> ghcr.io/zuoa/model-transformer
#
# Note: rknn-toolkit2 is x86_64-Linux-only, so the image is linux/amd64 only.
on:
  push:
    branches: [main, master]
    tags: ['v*']
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}
  # rknn-toolkit2 version to vendor. Bump here when upgrading.
  RKNN_VERSION: '2.3.2'

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Derive image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short
            type=raw,value=latest,enable={{is_default_branch}}

      - name: Fetch rknn-toolkit2 wheel into ./wheels
        run: |
          set -euo pipefail
          git clone --filter=blob:none --no-checkout --depth 1 \
            https://github.com/airockchip/rknn-toolkit2.git /tmp/rknn
          cd /tmp/rknn
          git sparse-checkout init --cone
          git sparse-checkout set rknn-toolkit2/packages/x86_64
          git checkout
          # Wheels are stored as plain Git objects in this repo; pull LFS too,
          # harmlessly, in case that ever changes.
          git lfs pull 2>/dev/null || true
          mkdir -p "$GITHUB_WORKSPACE/wheels"
          shopt -s nullglob
          cp rknn-toolkit2/packages/x86_64/rknn_toolkit2-${RKNN_VERSION}-cp312-*.whl \
             "$GITHUB_WORKSPACE/wheels/" \
            || cp rknn-toolkit2/packages/x86_64/rknn_toolkit2-*-cp312-*.whl \
                  "$GITHUB_WORKSPACE/wheels/"
          echo "Vendored wheel(s):"
          ls -lh "$GITHUB_WORKSPACE/wheels/"*.whl

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
